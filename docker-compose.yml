name: kopala-icr-dev

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kopala_icr}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Host port 5436, not 5432 — avoids clashing with a Postgres already
      # running natively on this machine, and with the sibling
      # Independence Run API dev stacks (Siavonga 5433, Solwezi 5434,
      # Kabwe 5435). The backend container still talks to this db over
      # the internal Docker network at db:5432 regardless; this mapping
      # is only for reaching it with a local tool (psql, DBeaver, etc) at
      # localhost:5436.
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177,http://localhost:5178,http://localhost:5179"
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Host port 8004, not 8000 — matches VITE_API_BASE_URL already set
      # in kopalaicr/.env.example, and avoids clashing with the sibling
      # Independence Run APIs (Siavonga 8001, Solwezi 8002, Kabwe 8003).
      # The API is reachable at http://localhost:8004/api/v1/...
      - "8004:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py runserver 0.0.0.0:8000"

  # The frontend (kopalaicr) runs separately via `npm run dev` on its own
  # machine/port (fast hot-reload, no rebuild needed) and talks to this
  # backend at http://localhost:8004/api/v1/... cross-origin — see
  # CORS_ALLOWED_ORIGINS above and the root README.

volumes:
  db_data:
